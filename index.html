<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#f2f4ff;--mu:#9aa0c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 18s ease-in-out infinite}
.o1{width:50vmax;height:50vmax;background:#6a2cff;left:-15vmax;top:-15vmax}
.o2{width:45vmax;height:45vmax;background:#00c2ff;right:-15vmax;top:20vh;animation-delay:-6s}
.o3{width:40vmax;height:40vmax;background:#ff2d95;left:20vw;bottom:-20vmax;animation-delay:-12s}
@keyframes float{50%{transform:translate(8vmax,6vmax) scale(1.15)}}
.grid{position:absolute;inset:-50% -50% 0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px;transform:perspective(500px) rotateX(60deg);animation:move 6s linear infinite;mask-image:linear-gradient(transparent,#000 70%)}
@keyframes move{to{background-position:0 48px,48px 0}}
#hub{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:48px 20px 60px;transition:opacity .35s,transform .35s}
#hub.out{opacity:0;transform:scale(.96);pointer-events:none}
header{text-align:center;margin-bottom:36px}
h1{font:900 clamp(34px,8vw,68px)/1.05 Orbitron,sans-serif;letter-spacing:2px;background:linear-gradient(90deg,#fff,#7de3ff 40%,#ff7ad1);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(125,227,255,.35))}
header p{color:var(--mu);margin-top:12px;font-size:clamp(14px,3.5vw,18px)}
.badge{display:inline-block;margin-bottom:14px;padding:5px 14px;border:1px solid var(--bd);border-radius:99px;font-size:12px;letter-spacing:3px;color:#7de3ff;background:var(--card)}
h2{font:700 15px Orbitron,sans-serif;letter-spacing:3px;color:var(--mu);margin:34px 0 16px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.feat{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:24px;background:var(--card);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px);cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden;animation:in .6s both}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0,var(--c),transparent 60%);opacity:.22;transition:opacity .25s}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--c);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 28px -4px var(--c)}
.card:hover::before{opacity:.45}.card:active{transform:scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
.ico{position:relative;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--c),#0006);box-shadow:0 6px 18px -4px var(--c)}
.card h3{position:relative;font:700 18px Orbitron,sans-serif}
.card p{position:relative;color:var(--mu);font-size:14px;flex:1}
.play{position:relative;border:0;border-radius:14px;padding:12px;font:700 14px Orbitron,sans-serif;letter-spacing:2px;color:#07071a;background:linear-gradient(90deg,#fff,var(--c));cursor:pointer;transition:filter .2s}
.card:hover .play{filter:brightness(1.15)}
.tag{position:absolute;top:16px;right:16px;font-size:11px;letter-spacing:2px;padding:3px 10px;border-radius:99px;background:#ffffff1f;color:#fff}
footer{text-align:center;color:var(--mu);font-size:13px;margin-top:44px}
#stage{position:fixed;inset:0;z-index:5;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#stage.on{opacity:1;pointer-events:auto}
#stage iframe{width:100%;height:100%;border:0;display:block}
#home{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;display:none;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,30,.55);backdrop-filter:blur(10px);color:#fff;font:700 12px Orbitron,sans-serif;letter-spacing:1px;cursor:pointer;opacity:.7;transition:opacity .2s}
#home:hover{opacity:1}#stage.on~#home{display:flex}
</style></head><body>
<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div></div>
<main id="hub">
<header><span class="badge">MINI ARCADE</span><h1>ARCADE HUB</h1><p>Seven head-to-head games. One tap to play.</p></header>
<h2>★ Featured Games</h2><div class="cards feat" id="feat"></div>
<h2>All Games</h2><div class="cards" id="all"></div>
<footer>Pick a game · tap ⌂ Home anytime to come back</footer>
</main>
<div id="stage"></div>
<button id="home" onclick="back()">⌂ HOME</button>

function card(g,k){const e=document.createElement('div');e.className='card';e.style.setProperty('--c',g.c);e.style.animationDelay=k*70+'ms';
e.innerHTML=`<span class="tag">#${k+1}</span><div class="ico">${g.i}</div><h3>${g.n}</h3><p>${g.d}</p><button class="play">PLAY</button>`;
e.onclick=()=>launch(g.id);return e}
G.forEach((g,k)=>{(k<3?feat:all).appendChild(card(g,k))});
const hub=document.getElementById('hub'),st=document.getElementById('stage');
function launch(id){const b=Uint8Array.from(atob(SRC[id]),c=>c.charCodeAt(0));
const f=document.createElement('iframe');f.allow='fullscreen; autoplay; accelerometer';f.srcdoc=new TextDecoder().decode(b);
st.innerHTML='';st.appendChild(f);hub.classList.add('out');setTimeout(()=>{st.classList.add('on');f.focus()},250);
try{history.pushState({g:id},'')}catch(e){}}
function back(){st.classList.remove('on');hub.classList.remove('out');setTimeout(()=>{if(!st.classList.contains('on'))st.innerHTML=''},400);window.scrollTo(0,0)}
addEventListener('popstate',()=>{if(st.classList.contains('on'))back()});
</script></body></html>
